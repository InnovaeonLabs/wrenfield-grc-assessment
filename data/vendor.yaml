# Third-party risk: tiering method, inventory, deep assessment of Quarrystone Analytics (fictional).
tiering:
  factors:
    data_sensitivity: {0: None, 1: Internal, 2: "Confidential / PII / limited PHI", 3: "PHI / regulated"}
    data_volume: {0: None, 1: "< 1,000 records", 2: "1,000 – 50,000", 3: "> 50,000"}
    access: {0: None, 1: "SaaS user-level", 2: "API / file transfer", 3: "Privileged or network access into Wrenfield systems"}
    criticality: {0: Low, 1: Moderate, 2: High, 3: "Critical (platform outage)"}
    substitutability: {0: Easy, 1: Moderate, 2: "Hard (> 6 months to replace)"}
  tiers:
    - {tier: 1, min: 9, reassess: "Annual full assessment + continuous monitoring"}
    - {tier: 2, min: 5, reassess: "Every 2 years + at renewal"}
    - {tier: 3, min: 0, reassess: "At renewal (lightweight)"}
