vendor_findings:
- {id: VR-001, title: "Undisclosed offshore subcontractor with production access to Wrenfield PHI", severity: Critical, party: Vendor, questions: [VQ-05, VQ-23, VQ-28, VQ-30], description: "Meridian Offshore Data Services (Pune) performs pipeline troubleshooting with production read access to Wrenfield's full PHI dataset. Conflicts with SHCA CSA §6.1 (for SHCA data) and 2 current customer BAAs (incl. Lakemont) that prohibit offshore access.", recommendation: "Immediate suspension of offshore access to Wrenfield data; contract amendment requiring US-only access with technical enforcement (geo-restricted IdP policy, US-only support roster) and access-log attestation quarterly", owner: "Quarrystone CISO / Miriam Castell", status: "Interim contained (offshore access suspended 2026-07-24); contractual fix open", finding: FIND-016, escalated: "CEO notified 2026-07-17 (Critical = outside appetite; 5-business-day rule met)"}
- {id: VR-002, title: "Breach notification term of 30 days", severity: High, party: Vendor, questions: [VQ-16], description: "BAA allows up to 30 days. Wrenfield must notify SHCA within 24h and customers within 5 business days, so a 30-day upstream delay makes compliance impossible.", recommendation: "Amend BAA to 24h notice of suspected or confirmed incidents affecting Wrenfield data, with defined content and updates", owner: "Theo Anand (General Counsel)", status: "In negotiation (redline v3)", finding: FIND-016}
- {id: VR-003, title: "Extract exceeds minimum necessary (27 of 58 fields unused)", severity: High, party: Wrenfield, questions: [VQ-21], description: "Wrenfield sends address, phone, email, and free-text notes that the model does not use. Increases breach impact and conflicts with HIPAA minimum necessary (164.502(b)).", recommendation: "Redesign extract to 31 required fields; replace direct identifiers with tokenized IDs; re-validate model on minimized data", owner: "Liam Porter (Data Engineering)", status: "In progress (target 2026-10-16)", finding: FIND-016}
- {id: VR-004, title: "Penetration test evidence stale and incomplete", severity: Moderate, party: Vendor, questions: [VQ-12], description: "Last external test 2025-03 (18 months). Summary letter only. Retest of the High finding not evidenced.", recommendation: "Provide full report (under NDA) or detailed executive summary with finding list and retest letter; annual testing clause in amendment", owner: "Quarrystone CISO", status: "Evidence requested (EVID-051, overdue)", finding: FIND-016}
- {id: VR-005, title: "Data retention and return/destruction undefined", severity: Moderate, party: Vendor, questions: [VQ-25, VQ-26], description: "Return 'upon request' with no timeframe or certificate. Derived data kept indefinitely.", recommendation: "Return/destroy within 30 days of termination with certificate; derived features deleted or contractually de-identified; retention schedule appended to MSA", owner: "Theo Anand (General Counsel)", status: "In negotiation", finding: FIND-016}
- {id: VR-006, title: "SOC 2 exceptions (access reviews, change approvals)", severity: Low, party: Vendor, questions: [VQ-03, VQ-04, VQ-33], description: "2 exceptions with adequate management responses. Report period ended 2025-09-30. Bridge letter covers to 2026-03-31.", recommendation: "Monitor: obtain next SOC 2 (expected 2026-12) and confirm exceptions resolved", owner: "Beth Kowalski", status: "Monitor", finding: ""}
- {id: VR-007, title: "Wrenfield not performing SOC 2 CUEC for portal user management; no SSO", severity: Moderate, party: Wrenfield, questions: [VQ-07], description: "The SOC 2 lists 'user entities are responsible for managing and reviewing their users' portal access' as a complementary user-entity control. Wrenfield had never reviewed its 6 portal user accounts; 1 former employee was active (AR-EX-04).", recommendation: "Add portal to quarterly certification and JML checklist (done); budget SAML SSO at renewal", owner: "Liam Porter", status: "Partially remediated (review + JML done; SSO at 2027 renewal)", finding: FIND-001}
- {id: VR-008, title: "Incomplete subcontractor disclosure; no notice of new subcontractors", severity: Moderate, party: Vendor, questions: [VQ-27, VQ-29], description: "Questionnaire listed 2 subcontractors; 4 exist. No contractual notice or approval for new subcontractors. SHCA CSA §6.3 requires approval before a subcontractor accesses agency data.", recommendation: "Complete subcontractor schedule in amendment; 30-day advance notice and right to object; SHCA approval workflow", owner: "Theo Anand (General Counsel)", status: "In negotiation", finding: FIND-016}
- {id: VR-009, title: "Access logs kept 90 days; no commitment to support investigations", severity: Moderate, party: Vendor, questions: [VQ-17, VQ-20], description: "Wrenfield could not scope a breach at the vendor older than 90 days.", recommendation: "12-month log retention for access to Wrenfield data; contractual log provision within 5 business days of request", owner: "Theo Anand (General Counsel)", status: "In negotiation", finding: FIND-016}
- {id: VR-010, title: "Secondary use of pooled de-identified data", severity: Moderate, party: "Both (legal review)", questions: [VQ-22], description: "Vendor de-identifies Wrenfield-supplied PHI and pools it for cross-client model training. Whether Wrenfield's customer BAAs permit its subcontractor to de-identify for this purpose is unresolved. Safe Harbor output is not PHI, but the act of de-identifying is a use of PHI that must be permitted.", recommendation: "General Counsel opinion; either opt Wrenfield data out of pooling or confirm customer BAAs permit it and disclose", owner: "Theo Anand (General Counsel)", status: "Legal review in progress", finding: FIND-016}
- {id: VR-011, title: "No SBOM for vendor software", severity: Low, party: Vendor, questions: [VQ-14], description: "Limits Wrenfield's ability to assess exposure to newly disclosed component vulnerabilities.", recommendation: "Request SBOM availability on the roadmap; revisit at 2027 renewal", owner: "Beth Kowalski", status: "Monitor", finding: ""}
- {id: VR-012, title: "Extract transferred from an unsupported Wrenfield host", severity: Moderate, party: Wrenfield, questions: [VQ-35], description: "The full-PHI extract leaves via wf-sftp-01 (Windows Server 2012 R2).", recommendation: "Managed transfer service (POAM-011) with PGP-encrypted files", owner: "Tomasz Wierzbicki", status: "In progress (delayed; POAM-011)", finding: FIND-011}

decision:
  inherent: "Critical (Tier 1 score 12/14): full PHI of about 410k patients, external processing, undisclosed offshore access, weak notification terms"
  material_findings: [VR-001, VR-002, VR-003]
  mitigating_controls: "SOC 2 Type II (unqualified), strong encryption and MFA, immutable backups, US storage, $5M cyber insurance, WCP rules-based fallback for scores, interim suspension of offshore access (2026-07-24)"
  residual: "Moderate after conditions (RISK-010 residual L2 x I4 = 8); High until conditions are met"
  treatment: "Mitigate (conditional continuation) + partial Transfer"
  rationale: >-
    Avoid (replace the vendor) was rejected: replacement takes 9 to 12 months, the rules-based fallback is materially less accurate, and the
    vendor's core controls are mature. The problems are contractual and in data design, not a weak security program.
    Accept was rejected: VR-001 is Critical and VR-002/VR-003 are High, all outside appetite (RSK-MTH-001 §7).
    Transfer alone is insufficient: insurance and indemnity move money, not accountability or contractual compliance.
    Mitigate works because the 2027-01-31 renewal gives leverage and the fixes are well-defined.
    SHCA data will not flow to Quarrystone until the conditions precedent are met.
  approved_by: "Elena Marsh (CEO) on recommendation of CISO and VP Clinical Analytics, 2026-07-22"
  conditions_precedent_for_shca_data:
    - "Executed amendment: US-only storage and access with technical enforcement; subcontractor schedule and approval rights (VR-001, VR-008)"
    - "24-hour breach notification (VR-002)"
    - "Minimized, tokenized extract live (VR-003)"
  contract_requirements:
    - "24h incident notification with defined content and updates"
    - "US-only data storage and access, including subcontractors; quarterly access-log attestation"
    - "Subcontractor schedule; 30-day advance notice; right to object; SHCA approval for agency data"
    - "Data return/destruction within 30 days of termination with certificate; retention schedule"
    - "12-month access-log retention; log provision within 5 business days"
    - "Annual independent penetration test with retest evidence"
    - "No secondary use of Wrenfield data without written consent (pending legal opinion, VR-010)"
    - "Cyber insurance of at least $10M (raise from $5M) naming Wrenfield as additional insured; indemnity for breach costs"
    - "SAML SSO for portal (Enterprise tier) at renewal"
  monitoring:
    - "Quarterly: US-only access attestation with access-log sample; subcontractor change notice check"
    - "Semi-annual: SOC 2 report or bridge letter; open-issue review with vendor CISO"
    - "Continuous: external attack-surface and breach-news monitoring; contract-renewal trigger"
    - "Event-driven: reassess on incident, subcontractor change, or material service change"
  reassessment: "Focused reassessment 2027-01 (before SHCA data flows), then annual full assessment (Tier 1)"
