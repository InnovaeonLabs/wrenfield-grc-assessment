    - {name: "Meridian Offshore Data Services Pvt. Ltd. (fictional)", role: "Data-engineering support: pipeline troubleshooting with production access", location: "Pune, India", in_soc2: "Not listed", disclosed_initially: "No (found at interview 2026-07-14)"}
    - {name: "Hollis Helpdesk (fictional)", role: "Support ticketing (tickets may contain PHI snippets)", location: US, in_soc2: "Not listed", disclosed_initially: "No"}
  inherent_score: 12
  inherent_rating: "Tier 1, Critical inherent risk"
  assessment_window: "2026-06-22 to 2026-07-24"
  assessor_contacts: "Quarrystone CISO (interview 2026-07-14), Head of Data Engineering"

