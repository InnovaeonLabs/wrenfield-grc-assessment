  resources: "IAM Engineer (about 60h); Okta Workflows (existing license); HR ops (4h)"
  open_date: 2026-08-07
  original_target: 2026-09-11
  current_target: 2026-09-11
  status: Closed
  milestones:
  - {id: M1, desc: "Disable 4 identified accounts (AR-EX-01..04); investigate post-termination sign-in (INC-2026-0117)", due: 2026-07-10, status: Done, completed: 2026-07-09}
  - {id: M2, desc: "Deploy daily HR-to-Okta/AWS IAM/portal reconciliation job with auto-ticketing", due: 2026-08-21, status: Done, completed: 2026-08-03}
  - {id: M3, desc: "Update SOP-IAM-02 (24h SLA, local-account checklist, vendor portals); train IT", due: 2026-08-28, status: Done, completed: 2026-08-26}
  - {id: M4, desc: "Assessor validation: re-perform termination test on all terminations since 2026-07-01 + 5 job runs", due: 2026-09-11, status: Done, completed: 2026-09-10}
