# ------------------------------------------------------------------ AU
- id: AU-2
  <<: *d
  family: AU
  name: Event Logging
  requirement: Identify the event types the system can log; coordinate logging with other entities; specify the event types to be logged; review and update the selection at a defined frequency.
  origination: System-specific
  systems: SYS-01, SYS-02, SYS-03, SYS-04
  owner: Owen Castillo (Security Engineer)
  status_owner: Implemented
  status_validated: Implemented
  implementation: Logging & Monitoring Standard LMS-004 defines required events. Sources include the AWS Organizations CloudTrail trail (management and S3 data events for PHI buckets), EKS audit logs, Aurora database activity logging for PHI tables, the application audit catalog (PHI view/export/print events with user, patient ID, and timestamp), and Okta and GitHub audit logs forwarded to the SIEM.
  requirements: [REQ-019, REQ-005]
  evidence_required: Logging standard; trail configurations; sample events for each required type
  evidence: [EVID-021]
  methods: [Examine, Test]
  test_summary: "Traced 10 required event types (for example, PHI record view, bulk export, IAM policy change, Okta admin role grant) from action to SIEM. Expected: each event recorded with who, what, when, and where. Actual: 10 of 10 found with required fields. The event catalog was last reviewed 2026-02."
  result: Satisfied
  evidence_level: Implementation
  gap: ""
  risk_rating: ""
  risks: []
  findings: []
  obs: []
  poams: []
  csf: DE

- id: AU-6
  <<: *d
  family: AU
  name: Audit Record Review, Analysis, and Reporting
  requirement: Review and analyze audit records at a defined frequency for signs of inappropriate or unusual activity; report findings to defined personnel; adjust review when risk changes.
  origination: System-specific
  systems: SYS-01, SYS-02, SYS-08
  owner: Owen Castillo (Security Engineer)
  status_owner: Implemented
  status_validated: Partially Implemented
  implementation: MDR monitors alerts 24x7 (SI-4). Separately, LMS-004 §6 requires a weekly human review of privileged activity (AWS admin actions, Okta admin changes, GitHub owner actions), documented in a SEC ticket. One primary reviewer, no designated backup.
  requirements: [REQ-019, REQ-005]
  evidence_required: Weekly review tickets for the whole period with dispositions
  evidence: [EVID-022, EVID-072]
  methods: [Examine, Test]
  test_summary: "Tested all 26 weeks (test-results/au6-log-review.md). Expected: 26 of 26 performed within 5 days with every flag dispositioned. Actual: 19 performed and 17 fully effective (65%). 7 weeks were missed (migration, PTO) and 2 reviews were marked 'reviewed' with undispositioned flags. The review scope also excluded local IAM users."
  result: Other Than Satisfied
  evidence_level: Operating Effectiveness
  gap: Key detective review has a single point of failure and incomplete scope.
  risk_rating: Moderate
  risks: [RISK-005]
  findings: [FIND-009]
  obs: []
  poams: [POAM-009]
  next_review: 2026-10-31
  csf: DE

- id: AU-9
  <<: *d
  family: AU
  name: Protection of Audit Information
  requirement: Protect audit information and logging tools from unauthorized access, modification, and deletion; alert on detected unauthorized access, modification, or deletion.
  origination: System-specific
  systems: SYS-01
  owner: Owen Castillo (Security Engineer)
  status_owner: Implemented
  status_validated: Implemented
  implementation: CloudTrail and audit logs are delivered to a dedicated log-archive account. The S3 bucket uses Object Lock in compliance mode, a bucket policy denying deletes, and an SCP blocking StopLogging and DeleteTrail for all non-break-glass principals. The SIEM admin role is limited to 1 person, plus MDR read access.
  requirements: [REQ-019]
  evidence_required: Log bucket configuration; SCPs; access list for the log account
  evidence: [EVID-023]
  methods: [Examine, Test]
  test_summary: "Examined Object Lock and the SCPs. Using the assessor's read-only role, confirmed an attempt to call cloudtrail:StopLogging returns AccessDenied (explicit SCP deny). Expected: logs are immutable to operational admins. Actual: met."
  result: Satisfied
  evidence_level: Implementation
  gap: ""
  risk_rating: ""
  risks: []
  findings: []
  obs: []
  poams: []
  csf: DE

- id: AU-11
  <<: *d
  family: AU
  name: Audit Record Retention
  requirement: Retain audit records for a defined period consistent with records-retention policy to support after-the-fact investigations and meet regulatory and organizational retention requirements.
  origination: System-specific
  systems: SYS-01, SYS-08
  owner: Owen Castillo (Security Engineer)
  status_owner: Implemented
  status_validated: Partially Implemented
  implementation: "At assessment: SIEM hot retention 90 days; the log-archive S3 lifecycle expired CloudTrail at 180 days; CloudWatch application-audit (PHI access) logs were kept 90 days with no archive. The CSA requires 12 months (90 days searchable)."
  requirements: [REQ-005, REQ-019]
  evidence_required: Retention settings for every audit source, and confirmation that the oldest available records match the setting
  evidence: [EVID-024, EVID-067]
  methods: [Examine, Test]
