  applicability_rationale: No wireless networking exists within the WCP-PROD boundary (AWS-hosted). Office Wi-Fi is outside the boundary and has no privileged path to production; production access from any network requires Okta SSO+MFA. Re-examine if the boundary changes.
  origination: n/a
  systems: n/a
