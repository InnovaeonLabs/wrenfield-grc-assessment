# ------------------------------------------------------------------ AT
- id: AT-2
  <<: *d
  family: AT
  name: Literacy Training and Awareness
  requirement: Provide security and privacy literacy training to users at onboarding and at a defined frequency after that; include practical exercises (such as phishing simulations); update content after defined events.
  origination: Common (organization-wide)
  systems: All workforce
  owner: Denise Yamamoto (Director of People)
  status_owner: Implemented
  status_validated: Partially Implemented
  implementation: Annual HIPAA and security awareness module in the LMS, plus quarterly phishing simulations. Policy requires completion within 30 days of assignment and suspends access after 30 days overdue, but the suspension is not enforced.
  requirements: [REQ-015]
  evidence_required: LMS completion report for the full workforce; phishing simulation results; escalation records
  evidence: [EVID-019]
  methods: [Examine, Test]
  test_summary: "Compared the LMS roster (347) to the Okta active population. Expected: 100% completion (or documented exceptions). Actual: 316 of 347 (91%); 31 overdue, 4 of them with PHI data-store access. Phishing simulations ran 2 of 2 quarters (click rate 6.1% to 4.3%). Post-remediation: 344 of 347 (3 on leave) is under review (EVID-070)."
  result: Other Than Satisfied
  evidence_level: Operating Effectiveness
  gap: Completion enforcement not operating.
  risk_rating: Low
  risks: [RISK-015]
  findings: [FIND-019]
  obs: []
  poams: [POAM-019]
  next_review: 2026-10-15
  csf: GV

- id: AT-3
  <<: *d
  family: AT
  name: Role-based Training
  requirement: Provide role-based security and privacy training to personnel with assigned roles before authorizing access, and at a defined frequency after that.
  origination: Common (organization-wide)
  systems: Engineering, SRE, Clinical Ops, Security
  owner: Denise Yamamoto (Director of People)
  status_owner: Implemented
  status_validated: Implemented
  implementation: Secure-coding training (annual) for engineers; privileged-user training for admins; HIPAA minimum-necessary training for clinical and support staff. Tracked in the LMS by role group.
  requirements: [REQ-015]
  evidence_required: Role-based curricula and completion by role group
  evidence: [EVID-020]
  methods: [Examine, Test]
  test_summary: "Sampled 15 role holders (5 engineers, 5 admins, 5 support/clinical). Expected: role training complete before access, or within 30 days of the role change. Actual: 15 of 15 complete. One admin completed 9 days after receiving admin access, within the 30-day grace in the training standard."
  result: Satisfied
  evidence_level: Operating Effectiveness
  gap: ""
  risk_rating: ""
  risks: []
  findings: []
