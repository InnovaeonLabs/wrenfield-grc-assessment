  rationale_inherent: "L3: supply-chain attacks are increasing. I5: code execution in the PHI platform."
  rationale_current: "L3: good pipeline hygiene, but no program-level supply chain risk management. I4: OIDC and least-privilege deploy roles limit what a compromised pipeline can reach."
  rationale_residual: "L2: C-SCRM plan, current vendor reviews, fourth-party visibility. I4."
