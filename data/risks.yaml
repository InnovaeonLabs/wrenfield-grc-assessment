- id: RISK-012
  title: Cloud misconfiguration exposing PHI or admin services
  asset: AWS wcp-prod network and storage configuration
  threat: Opportunistic internet scanning; misconfiguration exploited by attackers
  vulnerability: Console changes bypass IaC; CSPM findings not routed to on-call
  description: A manual misconfiguration (an open port, a public resource) exposes PHI or an admin interface to the internet.
  existing_controls: Org-wide S3 Block Public Access (SCP); encryption by default; Security Hub CIS checks; IaC for most resources
  inherent: [4, 5]
  current: [2, 5]
  residual: [2, 4]
  rationale_inherent: "L4: misconfiguration is a leading cloud breach cause. I5: public PHI exposure."
  rationale_current: "L2: strong preventive guardrails for data stores (block public access, encryption). The observed exposure was an admin port, not data. I5: remains the worst credible case."
  rationale_residual: "L2: CSPM routed to on-call plus SCP guardrails on admin ports. I4: guardrails prevent the most severe (data-store) exposures."
  treatment: Mitigate
  mitigation: Route CSPM to on-call; admin-port guardrail; emergency change auto-revert (POAM-012, POAM-018)
  owner: Tomasz Wierzbicki (Director, Platform Engineering)
  target_date: 2026-09-11
  status: Treatment in progress
  controls: [CM-2, CM-6, SC-7, SC-28]
  findings: [FIND-012]
  poams: [POAM-012]
  review_date: 2026-09-18
- id: RISK-013
  title: Fraudulent vendor payment through an SoD conflict
  asset: Ledgerline vendor master and payments
  threat: Insider fraud or coerced insider (business email compromise)
  vulnerability: One user holds vendor-master maintenance and payment approval (≤ $25k)
  description: A user alters vendor bank details and approves payments to an attacker-controlled account.
  existing_controls: "Compensating: monthly vendor-master change report reviewed by the Controller; callback verification of bank-detail changes; payments over $25k need CFO approval"
  inherent: [3, 3]
  current: [2, 3]
  residual: [2, 3]
  rationale_inherent: "L3: BEC-driven bank-change fraud is common. I3: bounded by the $25k approval limit and monthly detection (worst credible case $100k–500k over a month)."
  rationale_current: "L2: the compensating review operated 6 of 6 months, plus callbacks. I3."
  rationale_residual: "L2. I3: accepted with the compensating control until the roles are split."
