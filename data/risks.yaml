  asset: CI/CD pipeline, open-source dependencies, vendor integrations
  threat: Malicious dependency or compromised vendor update or integration
  vulnerability: No C-SCRM plan; no fourth-party inventory; 5 vendors overdue for review
  description: A compromised dependency or vendor integration introduces malicious code or access into WCP.
  existing_controls: Dependency scanning; branch protection and required review; OIDC deploy (no static keys); pinned base images
  inherent: [3, 5]
