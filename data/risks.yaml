  threat: Phishing, help-desk social engineering, BEC
  vulnerability: 9% training non-completion (at fieldwork); human error
  description: A user is tricked into disclosing credentials, approving a push, or sending PHI or payments to an attacker.
  existing_controls: MFA with number challenge; email security; phishing simulations (4.3% click rate); help-desk identity verification; EDR
