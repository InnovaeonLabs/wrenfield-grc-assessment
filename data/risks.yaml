  asset: WCP production configuration
  threat: Human error under time pressure; unreviewed emergency changes
  vulnerability: Emergency and console change paths lack enforced approval and revert
  description: An emergency or console change is made without review and introduces an outage or exposure (FIND-012 is a realized example).
  existing_controls: PR review and CI for code and IaC; protected deploy environments
