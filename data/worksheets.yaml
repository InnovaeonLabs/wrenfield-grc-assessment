  - {tp: TP-SA-22-02, method: Examine, procedure: "Look for alternative support (extended security updates) or SHCA-approved exceptions", expected: "Documented alternative or exception", actual: "None", result: Fail, evidence: "EVID-052"}
  - {tp: TP-SA-22-03, method: Examine, procedure: "Assess compensating controls on wf-sftp-01", expected: "Info only", actual: "EDR, allowlist, weekly scans; RDP exposure found (FIND-012) then closed", result: Info, evidence: "EVID-053, EVID-068"}
  conclusion: Other Than Satisfied
  deficiency: "Unsupported components in the PHI path."
  findings: [FIND-011]
  owner_response: "Agree; migration delayed by customer dependencies"
- control: SR-6
  objective: "Supply chain-related risks of suppliers and the services they provide are assessed and reviewed at the defined frequency."
